<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Instituto Constancy · Sistema de Gestão CS</title>
<style>
:root{
  --bg:#f4f6f7; --card:#ffffff; --ink:#1c2b2a; --muted:#6b7c7b;
  --line:#e4e9e8; --brand:#0f766e; --brand-dark:#0b544e; --brand-light:#e6f4f2;
  --ok:#1a9e6b; --warn:#d99a1b; --danger:#d1453b; --info:#3b6fd1;
  --hs:#a3195b; --hs-light:#fbe7f0;
  --radius:12px; --shadow:0 1px 3px rgba(20,30,30,.08), 0 1px 2px rgba(20,30,30,.06);
}
*{box-sizing:border-box;}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--ink);}
.app{display:flex;min-height:100vh;}
.sidebar{width:250px;background:var(--brand-dark);color:#eafaf6;flex-shrink:0;display:flex;flex-direction:column;padding:18px 0;position:sticky;top:0;height:100vh;overflow-y:auto;}
.sidebar .brand{padding:0 20px 16px;border-bottom:1px solid rgba(255,255,255,.12);margin-bottom:10px;}
.sidebar .brand h1{font-size:16px;margin:0 0 2px;font-weight:700;letter-spacing:.2px;}
.sidebar .brand p{font-size:11px;margin:0;color:#9fd8cd;}
.nav-item{display:flex;align-items:center;gap:10px;padding:10px 20px;font-size:13.5px;color:#d6efe9;cursor:pointer;border-left:3px solid transparent;white-space:nowrap;}
.nav-item .ic{font-size:15px;width:18px;text-align:center;}
.nav-item .cnt{margin-left:auto;font-size:11px;background:rgba(255,255,255,.12);padding:1px 7px;border-radius:20px;}
.nav-item:hover{background:rgba(255,255,255,.06);}
.nav-item.active{background:rgba(255,255,255,.12);border-left-color:#5eead4;color:#fff;font-weight:600;}
.nav-item.hs{border-left-color:#f472b6;}
.nav-item.hs .ic{filter:none;}
.nav-item.hs.active{background:rgba(244,114,182,.16);}
.nav-item.sub{padding:7px 20px 7px 40px;font-size:12.5px;color:#a9d4c9;}
.nav-item.sub .ic{font-size:10px;}
.nav-item.sub.active{background:rgba(255,255,255,.10);border-left-color:#5eead4;color:#fff;font-weight:600;}
.nav-sep{font-size:10.5px;text-transform:uppercase;letter-spacing:.6px;color:#5f9990;padding:14px 20px 4px;}
.nav-divider{height:1px;background:rgba(255,255,255,.12);margin:10px 16px;}
main{flex:1;min-width:0;display:flex;flex-direction:column;}
.topbar{background:var(--card);border-bottom:1px solid var(--line);padding:16px 28px;display:flex;align-items:center;gap:14px;position:sticky;top:0;z-index:5;}
.topbar h2{font-size:19px;margin:0;flex-shrink:0;}
.topbar .sub{font-size:12.5px;color:var(--muted);margin-top:2px;}
.topbar-actions{margin-left:auto;display:flex;gap:8px;align-items:center;}
#content{padding:24px 28px 60px;}
.btn{border:none;background:var(--brand);color:#fff;padding:8px 14px;border-radius:8px;font-size:13px;cursor:pointer;font-weight:600;}
.btn:hover{background:var(--brand-dark);}
.btn.secondary{background:var(--card);color:var(--brand);border:1px solid var(--brand);}
.btn.ghost{background:transparent;color:var(--muted);border:1px solid var(--line);}
.btn.hs{background:var(--hs);}
.btn.hs:hover{background:#7d1147;}
.btn.danger{background:var(--danger);}
.btn.danger:hover{background:#a8352d;}
input.search,input[type=text],input[type=date],input[type=number],select,textarea{
  border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:13px;font-family:inherit;background:#fff;color:var(--ink);
}
select.inline-edit, input.inline-field{border:1px solid transparent;background:transparent;padding:4px 6px;font-size:12.8px;font-family:inherit;color:var(--ink);border-radius:6px;cursor:pointer;}
select.inline-edit{max-width:150px;}
input.inline-field{max-width:150px;cursor:text;}
input.inline-field[type=checkbox]{max-width:none;cursor:pointer;width:16px;height:16px;}
select.inline-edit:hover, input.inline-field:hover{border-color:var(--line);background:#fff;}
select.inline-edit:focus, input.inline-field:focus{border-color:var(--brand);background:#fff;outline:none;}
.kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px;margin-bottom:22px;}
.kpi-card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px 18px;}
.kpi-card .label{font-size:12px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.3px;}
.kpi-card .value{font-size:26px;font-weight:700;margin-top:6px;}
.kpi-card .value.ok{color:var(--ok);} .kpi-card .value.danger{color:var(--danger);} .kpi-card .value.warn{color:var(--warn);}
.kpi-card.hs{border:1px solid #f6cfe1;}
.card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px 20px;margin-bottom:18px;}
.card h3{margin:0 0 12px;font-size:14.5px;}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:18px;}
.grid-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:18px;}
.bar-row{display:flex;align-items:center;gap:8px;font-size:12.5px;margin-bottom:7px;}
.bar-row .lbl{width:140px;flex-shrink:0;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.bar-row .track{flex:1;background:#eef2f1;border-radius:6px;height:16px;overflow:hidden;}
.bar-row .fill{height:100%;background:var(--brand);border-radius:6px;}
.bar-row .fill.hs{background:var(--hs);}
.bar-row .n{width:34px;text-align:right;font-weight:600;flex-shrink:0;}
table{width:100%;border-collapse:collapse;font-size:12.8px;}
th{text-align:left;padding:9px 10px;background:#f7f9f8;color:var(--muted);font-weight:600;border-bottom:1px solid var(--line);white-space:nowrap;position:sticky;top:0;}
td{padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap;}
tbody tr:hover{background:var(--brand-light);cursor:pointer;}
tbody tr.row-alert{background:#fdeceb;}
tbody tr.row-alert:hover{background:#fbdcda;}
.table-wrap{max-height:calc(100vh - 260px);overflow:auto;border:1px solid var(--line);border-radius:10px;}
.toolbar{display:flex;gap:10px;align-items:center;margin-bottom:14px;flex-wrap:wrap;}
.toolbar .search{flex:1;min-width:200px;}
.chip{border:1px solid var(--line);background:#fff;padding:6px 13px;border-radius:20px;font-size:12.5px;cursor:pointer;color:var(--ink);}
.chip.active{background:var(--ink);color:#fff;border-color:var(--ink);}
.chip.critico.active{background:var(--danger);border-color:var(--danger);}
.chip.atencao.active{background:var(--warn);border-color:var(--warn);}
.chip.saudavel.active{background:var(--ok);border-color:var(--ok);}
.pill{display:inline-block;padding:2px 9px;border-radius:20px;font-size:11px;font-weight:700;}
.pill.ativo{background:#e3f7ee;color:var(--ok);}
.pill.inativo{background:#fdeceb;color:var(--danger);}
.pill.finalizado{background:#fdf3de;color:var(--warn);}
.pill.critico{background:#fdeceb;color:var(--danger);}
.pill.atencao{background:#fdf3de;color:var(--warn);}
.pill.saudavel{background:#e3f7ee;color:var(--ok);}
.pill.na{background:#eef1f1;color:var(--muted);}
/* Select de Status com a mesma cara do pill (Ativo verde, Inativo vermelho), mas continua editável */
select.status-pill-select{display:inline-block;padding:2px 22px 2px 9px;border-radius:20px;font-size:11px;font-weight:700;border:none;cursor:pointer;-webkit-appearance:none;appearance:none;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='10' viewBox='0 0 10 10'><path d='M1 3l4 4 4-4' fill='none' stroke='%23666' stroke-width='1.4'/></svg>");background-repeat:no-repeat;background-position:right 6px center;}
select.status-pill-select.ativo{background-color:#e3f7ee;color:var(--ok);}
select.status-pill-select.inativo{background-color:#fdeceb;color:var(--danger);}
select.status-pill-select.finalizado{background-color:#fdf3de;color:var(--warn);}
select.status-pill-select.na{background-color:#eef1f1;color:var(--muted);}
.empty-state{text-align:center;padding:50px 20px;color:var(--muted);}
.empty-state .emoji{font-size:34px;margin-bottom:10px;}
.modal-bg{position:fixed;inset:0;background:rgba(15,25,24,.45);display:none;align-items:flex-start;justify-content:center;z-index:50;overflow-y:auto;padding:40px 20px;}
.modal-bg.show{display:flex;}
.modal{background:#fff;border-radius:14px;max-width:760px;width:100%;padding:24px 26px;box-shadow:0 10px 40px rgba(0,0,0,.2);}
.modal h3{margin-top:0;}
.modal .close{float:right;cursor:pointer;font-size:20px;color:var(--muted);}
.detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px 20px;margin-bottom:16px;}
.detail-grid .f{font-size:12.5px;}
.detail-grid .f .k{color:var(--muted);display:block;font-size:11px;text-transform:uppercase;letter-spacing:.3px;}
.detail-grid .f .v{font-weight:600;}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.form-grid label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted);font-weight:600;}
.form-grid label.full{grid-column:1/-1;}
.tabs-sub{display:flex;gap:6px;margin-bottom:16px;flex-wrap:wrap;}
.tabs-sub button{border:1px solid var(--line);background:#fff;padding:7px 13px;border-radius:20px;font-size:12.5px;cursor:pointer;color:var(--ink);}
.tabs-sub button.active{background:var(--brand);color:#fff;border-color:var(--brand);}
.note{font-size:12px;color:var(--muted);background:#f7f9f8;border:1px dashed var(--line);border-radius:8px;padding:10px 12px;margin-bottom:14px;}
.note.hs{background:var(--hs-light);border-color:#f0b6d3;color:#7d1147;}
.legend-dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;}
.small{font-size:11.5px;color:var(--muted);}
.hs-formula{font-size:12px;background:#faf5f8;border:1px solid #f0dbe8;border-radius:10px;padding:12px 14px;margin-bottom:16px;line-height:1.9;}
.hs-formula b{color:var(--hs);}
.score-big{font-size:34px;font-weight:800;}
.cfg-row{display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid var(--line);}
.cfg-row input.cfg-input{flex:1;max-width:320px;}
.cfg-row .usage{width:110px;flex-shrink:0;}
::-webkit-scrollbar{width:9px;height:9px;}
::-webkit-scrollbar-thumb{background:#c9d3d1;border-radius:6px;}
@media(max-width:900px){.grid-2,.grid-3{grid-template-columns:1fr;}.sidebar{width:70px;}.sidebar .brand,.nav-item span.lbl,.nav-sep{display:none;}.nav-item{justify-content:center;}}
#login-loading{position:fixed;inset:0;background:var(--bg);z-index:9998;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:14px;text-align:center;padding:20px;}
#login-gate{position:fixed;inset:0;background:var(--bg);z-index:9999;display:none;align-items:center;justify-content:center;}
#login-gate .card{width:320px;background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:32px 34px;}
#login-gate h1{font-size:18px;margin:0 0 4px;color:var(--ink);}
#login-gate p{font-size:13px;color:var(--muted);margin:0 0 20px;}
#login-gate label{display:block;font-size:13px;font-weight:600;margin-bottom:4px;color:var(--ink);}
#login-gate input{width:100%;padding:9px 10px;margin-bottom:14px;border:1px solid var(--line);border-radius:8px;box-sizing:border-box;font-size:14px;}
#login-gate button{width:100%;padding:10px;background:var(--brand);color:#fff;border:none;border-radius:8px;font-weight:600;cursor:pointer;font-size:14px;}
#login-gate button:hover{background:var(--brand-dark);}
#login-gate .erro{margin-top:12px;font-size:13px;color:var(--danger);display:none;}
#user-chip{margin-top:auto;padding:14px 20px;border-top:1px solid rgba(255,255,255,.12);font-size:12px;color:#eafaf6;}
#user-chip button{cursor:pointer;}
</style>
</head>

<div id="login-loading">Carregando…</div>
<div id="login-gate">
  <div class="card">
    <h1>Instituto Constancy</h1>
    <p>Entre com o email e a senha da equipe para acessar o sistema.</p>
    <label>Email</label>
    <input type="email" id="lg-email" autocomplete="username">
    <label>Senha</label>
    <input type="password" id="lg-senha" autocomplete="current-password">
    <button onclick="fazerLogin()">Entrar</button>
    <div class="erro" id="lg-erro"></div>
  </div>
</div>
<div class="app">
  <aside class="sidebar">
    <div class="brand">
      <h1>Instituto Constancy</h1>

    </div>
    <div id="nav"></div>

  <main>
    <div class="topbar">

        <h2 id="page-title">Dashboard</h2>

      </div>
      <div class="topbar-actions" id="page-actions"></div>
    </div>
    <div id="content"></div>
  </main>
</div>

<div class="modal-bg" id="modal-bg">
  <div class="modal" id="modal-box"></div>
</div>

});
const EDITABLE_ARRAYS = ['pacientes','agendamentos','interacoesMedica','interacoesEnfermagem','interacoesNutricao','interacoesCS','protocolos','nps','crosssell','indicacoes'];

function buildConfigField(db, configKey){
  const meta = CONFIG_META[configKey];
  const vals = new Set();
  meta.usedBy.forEach(u=>{
    (db[u.arrayKey]||[]).forEach(r=>{ const v=r[u.fieldKey]; if(v!==null&&v!==undefined&&String(v).trim()!=='') vals.add(v); });
  });
  return Array.from(vals).sort((a,b)=>String(a).localeCompare(String(b),'pt-BR'));
}
function naturalId(arrayKey, r){
  if(arrayKey==='pacientes') return r['ID Paciente'];
  if(arrayKey==='protocolos') return r['IDRegistro'];
  if(arrayKey==='nps') return r['ID NPS'];
  if(arrayKey==='crosssell') return r['ID Cross sell'];
  if(arrayKey==='indicacoes') return r['ID Indicacao'];
  return null;
}

// Migração única: a antiga aba única "Interações CS" virou 4 seções por setor (Médica, Enfermagem,
// Nutrição, CS). Todo o histórico já lançado antes dessa divisão foi feito pela CS, então vira o
// histórico inicial do setor CS — os outros 3 setores começam do zero. Roda uma vez; depois disso
// db.interacoes deixa de existir e cada setor cresce no seu próprio array.
function migrateInteracoesParaSetores(db){
  if(Array.isArray(db.interacoes) && db.interacoes.length){
    const migradas = db.interacoes.map(r=>{
      const { ' Responsável': respAntigo, ...resto } = r;
      return { ...resto, 'Responsável': resto['Responsável'] !== undefined ? resto['Responsável'] : (respAntigo ?? null) };
    });
    db.interacoesCS = (db.interacoesCS||[]).concat(migradas);
  }
  delete db.interacoes;
}
function ensureShape(db){
  migrateInteracoesParaSetores(db);
  const arrays = ['pacientes','interacoesMedica','interacoesEnfermagem','interacoesNutricao','interacoesCS','protocolos','indicacoes','nps','crosssell','healthscore','agendamentos',
    'avalEnfermagem','avalNutricao','avalRecepcao','avalMedico','avalCS'];
  arrays.forEach(k=>{ if(!Array.isArray(db[k])) db[k] = []; });
  if(!db.config || typeof db.config !== 'object') db.config = {};
  Object.keys(CONFIG_META).forEach(configKey=>{
    if(!Array.isArray(db.config[configKey])) db.config[configKey] = buildConfigField(db, configKey);
  });
  ['Ativo','Inativo','Finalizado'].forEach(s=>{ if(!db.config.status.includes(s)) db.config.status.push(s); });
  ['Presencial','Online','Semi Presencial'].forEach(s=>{ if(!db.config.modalidade.includes(s)) db.config.modalidade.push(s); });
  ['Proativo','Reativo'].forEach(s=>{ if(!db.config.tipoContato.includes(s)) db.config.tipoContato.push(s); });

  ['Semana 1','Semana 2','Semana 3','Semana 4'].forEach(s=>{ if(!db.config.faseSemana.includes(s)) db.config.faseSemana.push(s); });
  ['Sim','Não'].forEach(s=>{ if(!db.config.domiciliar.includes(s)) db.config.domiciliar.push(s); });
  ['Em Andamento','Finalizado'].forEach(s=>{ if(!db.config.statusProtocolo.includes(s)) db.config.statusProtocolo.push(s); });
  // ID estável por linha (_rid), usado pela edição inline em qualquer módulo
  EDITABLE_ARRAYS.forEach(arrayKey=>{
    (db[arrayKey]||[]).forEach((r,i)=>{ if(!r._rid) r._rid = naturalId(arrayKey,r) || (arrayKey+'_'+i); });
  });
  return db;
}

function newRowRid(pid){
  return pid+'_'+Date.now().toString(36)+'_'+Math.random().toString(36).slice(2,6);
}
// Molde de cada seção vinculada ao paciente — usado tanto para criar (scaffold) quanto para reconciliar.
const INTERACAO_SETOR_BUILDER = (p)=>({'ID Paciente':p['ID Paciente'], 'Nome Paciente':p['Nome Completo'],

function reconcilePatientLinkedSections(db){

  // (registros incompletos/de teste) e, junto, tudo que dependia deles nas seções vinculadas.

  INTERACAO_ARRAYS.forEach(arrayKey=>{ db[arrayKey] = (db[arrayKey]||[]).filter(r=>patientIds.has(r['ID Paciente'])); });
  db.protocolos = (db.protocolos||[]).filter(r=>patientIds.has(r['ID Paciente']));
  db.nps = (db.nps||[]).filter(r=>patientIds.has(r['ID Paciente']));
  db.crosssell = (db.crosssell||[]).filter(r=>patientIds.has(r['ID Paciente']));
  db.indicacoes = (db.indicacoes||[]).filter(r=>patientIds.has(r['ID Embaixador']));
  db.indicacoes.forEach(r=>{ if(r['ID Novo Paciente'] && !patientIds.has(r['ID Novo Paciente'])) r['ID Novo Paciente']=null; });
  (db.agendamentos||[]).forEach(a=>{ if(a._convertedPatientId && !patientIds.has(a._convertedPatientId)) a._convertedPatientId=null; });
  db.pacientes.forEach(p=>{
    const pid = p['ID Paciente'];
    INTERACAO_ARRAYS.forEach(arrayKey=>{
      if(!db[arrayKey].some(r=>r['ID Paciente']===pid)){ const rec=SCAFFOLD_BUILDERS[arrayKey](p); rec._rid=newRowRid(pid); db[arrayKey].push(rec); }
    });
    if(!db.protocolos.some(r=>r['ID Paciente']===pid)){ const rec=SCAFFOLD_BUILDERS.protocolos(p); rec._rid=newRowRid(pid); db.protocolos.push(rec); }
    if(!db.nps.some(r=>r['ID Paciente']===pid)){ const rec=SCAFFOLD_BUILDERS.nps(p); rec._rid=newRowRid(pid); db.nps.push(rec); }
    if(!db.crosssell.some(r=>r['ID Paciente']===pid)){ const rec=SCAFFOLD_BUILDERS.crosssell(p); rec._rid=newRowRid(pid); db.crosssell.push(rec); }
    if(!db.indicacoes.some(r=>r['ID Embaixador']===pid)){ const rec=SCAFFOLD_BUILDERS.indicacoes(p); rec._rid=newRowRid(pid); db.indicacoes.push(rec); }
  });
  // Migração única: o antigo campo solto "Valor Total" do paciente vira o Valor do protocolo atual dele
  // (só roda se o protocolo atual ainda não tiver um Valor próprio — depois disso o protocolo manda).
  db.pacientes.forEach(p=>{
    const pid = p['ID Paciente'];
    const rows = db.protocolos.filter(r=>r['ID Paciente']===pid);
    if(!rows.length) return;
    const emAndamento = rows.filter(r=>r['Data Iníco'] && !r['Data Final']);
    const pool = emAndamento.length ? emAndamento : rows.filter(r=>r['Data Iníco']);
    const cur = pool.length ? pool.slice().sort((a,b)=> a['Data Iníco']<b['Data Iníco']?1:-1)[0] : rows[rows.length-1];
    if(cur && (cur['Valor']===undefined || cur['Valor']===null) && p['Valor Total ']!==undefined && p['Valor Total ']!==null && p['Valor Total ']!==''){
      cur['Valor'] = p['Valor Total '];
    }
  });
  return db;
}

// ---------- helpers ----------
function fmtDate(d){
  if(!d) return '—';
  const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(d);
  if(m) return `${m[3]}/${m[2]}/${m[1]}`;
  return d;
}
function fmtMoney(v){
  if(v===null||v===undefined||v==='' ) return '—';
  const n = typeof v === 'number' ? v : parseFloat(String(v).replace(/[^\d.,-]/g,'').replace('.','').replace(',','.'));
  if(isNaN(n)) return String(v);
  return n.toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
}
function esc(s){ if(s===null||s===undefined) return ''; return String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function uid(prefix, arr, key){
  let max=0;
  arr.forEach(r=>{ const m=/(\d+)$/.exec(r[key]||''); if(m) max=Math.max(max,parseInt(m[1],10)); });
  return prefix + String(max+1).padStart(4,'0');
}
function statusPillClass(s){
  if(!s) return 'na';
  s=s.toLowerCase();
  if(s.includes('ativo')&&!s.includes('inativo')) return 'ativo';
  if(s.includes('inativo')) return 'inativo';
  if(s.includes('finalizado')) return 'finalizado';
  return 'na';
}
function protocoloStatusPillClass(s){
  if(!s) return 'na';
  s=s.toLowerCase();
  if(s.includes('andamento')) return 'ativo';
  if(s.includes('finalizado')) return 'finalizado';
  return 'na';
}
function riskPillClass(s){
  if(!s) return 'na';
  s=s.toLowerCase();
  if(s.includes('crít')||s.includes('crit')) return 'critico';
  if(s.includes('atenç')||s.includes('atenc')) return 'atencao';
  if(s.includes('saud')) return 'saudavel';
  return 'na';
}
function round1(n){ return Math.round(n*10)/10; }
function avgIgnoringNulls(vals){
  const v = vals.filter(x=>x!==null && x!==undefined && !isNaN(x));
  if(!v.length) return null;
  return v.reduce((a,b)=>a+b,0)/v.length;
}

// ---------- generic searchable/sortable table ----------
function renderTable(opts){
  const wrapId = opts.containerId;
  const state = opts.state || (opts.state = {q:'', sortKey:null, sortDir:1});
  function draw(){
    let rows = opts.rows;
    if(state.q){
      const q = state.q.toLowerCase();
      rows = rows.filter(r => (opts.searchKeys||opts.columns.map(c=>c.key)).some(k => String(r[k]||'').toLowerCase().includes(q)));
    }
    if(opts.extraFilter) rows = rows.filter(opts.extraFilter);
    if(state.sortKey){
      rows = rows.slice().sort((a,b)=>{
        const av=a[state.sortKey], bv=b[state.sortKey];
        if(av===bv) return 0;
        if(av===null||av===undefined) return 1;
        if(bv===null||bv===undefined) return -1;
        return (av>bv?1:-1)*state.sortDir;
      });
    }
    const head = opts.columns.map(c=>`<th data-k="${c.key}" style="cursor:pointer">${esc(c.label)}${state.sortKey===c.key?(state.sortDir===1?' ▲':' ▼'):''}</th>`).join('');
    const body = rows.length ? rows.map((r,i)=>{
      const cells = opts.columns.map(c=> `<td>${c.render? c.render(r) : esc(r[c.key]!==undefined&&r[c.key]!==null&&r[c.key]!=='' ? r[c.key] : '—')}</td>`).join('');
      const rc = opts.rowClass ? opts.rowClass(r) : '';
      return `<tr data-i="${i}" class="${rc}">${cells}</tr>`;
    }).join('') : `<tr><td colspan="${opts.columns.length}"><div class="empty-state"><div class="emoji">🗂️</div>${opts.emptyMsg||'Nenhum registro encontrado.'}</div></td></tr>`;
    document.getElementById(wrapId).innerHTML = `
      <div class="table-wrap"><table><thead><tr>${head}</tr></thead><tbody>${body}</tbody></table></div>
      <div class="small" style="margin-top:8px;">${rows.length} registro(s)${opts.rows.length!==rows.length? ' · filtrado de '+opts.rows.length : ''}</div>`;
    const tbl = document.getElementById(wrapId);
    tbl.querySelectorAll('th').forEach(th=> th.onclick = ()=>{
      const k = th.dataset.k;
      if(state.sortKey===k) state.sortDir*=-1; else {state.sortKey=k; state.sortDir=1;}
      draw();
    });
    if(opts.rowClick){
      tbl.querySelectorAll('tbody tr[data-i]').forEach(tr=>{
        tr.onclick = ()=> opts.rowClick(rows[parseInt(tr.dataset.i,10)]);
      });
    }
  }
  draw();
  return {redraw:draw, setQuery:(q)=>{state.q=q;draw();}, state};
}

// ================= HEALTH SCORE ENGINE (motor central) =================
const AVAL_SHEET_MAP = {
  Enfermagem: 'avalEnfermagem', Nutrição: 'avalNutricao', Recepção: 'avalRecepcao',
  Médico: 'avalMedico', CS: 'avalCS',
};
function sectorNota(sector, patientId){
  const arr = DB[AVAL_SHEET_MAP[sector]] || [];
  const notas = arr.filter(r=>r['ID Paciente']===patientId).map(r=>r['Nota (0-10)']).filter(v=>typeof v==='number');
  return notas.length ? avgIgnoringNulls(notas) : null;
}
function latestNps(patientId){
  const regs = DB.nps.filter(r=>r['ID Paciente']===patientId && typeof r['Nota NPS']==='number');
  if(!regs.length) return null;
  regs.sort((a,b)=> String(b['Data Resposta']||'').localeCompare(String(a['Data Resposta']||'')));
  return regs[0]['Nota NPS'];
}
function riskFromScore(score){
  if(score===null) return 'Sem avaliação';
  if(score>=7) return 'Saudável';
  if(score>=4) return 'Atenção';
  return 'Crítico';
}
function computeHealthLive(p){
  const recepcao = sectorNota('Recepção', p['ID Paciente']);
  const nutricao = sectorNota('Nutrição', p['ID Paciente']);
  const medico = sectorNota('Médico', p['ID Paciente']);
  const cs = sectorNota('CS', p['ID Paciente']);
  const enfermagem = sectorNota('Enfermagem', p['ID Paciente']);
  const adesao = avgIgnoringNulls([recepcao, nutricao, medico]);
  const resultado = avgIgnoringNulls([medico, nutricao]);
  const engajamento = avgIgnoringNulls([cs, enfermagem, recepcao]);
  const healthScore = avgIgnoringNulls([adesao, resultado, engajamento]);
  return {
    id: p['ID Paciente'], nome: p['Nome Completo'], status: p['Status Paciente'],
    recepcao, nutricao, medico, cs, enfermagem,
    adesao, resultado, engajamento, healthScore,
    risco: riskFromScore(healthScore),
    nps: latestNps(p['ID Paciente']),
  };
}
function liveHealthList(){
  return DB.pacientes.map(computeHealthLive);
}

function renderNav(active){
  document.getElementById('nav').innerHTML = NAV.map((n)=>{
    if(n.sep) return `<div class="nav-sep">${esc(n.sep)}</div>`;
    // Subitens de setor (Médico/Enfermagem/Nutricional/CS, abaixo de Interações) ficam ativos só quando
    // a página é Interações E o setor selecionado bate com o desse item — assim o menu sempre mostra
    // exatamente em qual setor o usuário está.
    const isActive = n.sub ? (active===n.id && intSetorAtivo===n.setor) : (n.id===active);
    // Subitens de setor não mostram número — só o item master "Interações" traz a contagem (pacientes

    const cnt = n.sub ? null : countFor(n.id);
    const html = `<div class="nav-item ${n.hsAccent?'hs':''} ${n.sub?'sub':''} ${isActive?'active':''}" data-id="${n.id}" ${n.sub?`data-setor="${esc(n.setor)}"`:''}>

    </div>`;
    return html;
  }).join('');
  document.querySelectorAll('.nav-item[data-id]').forEach(el=>{
    el.onclick = ()=> el.dataset.setor ? irParaSetorInteracoes(el.dataset.setor) : (el.dataset.id==='interacoes' ? irParaInteracoesDashboard() : go(el.dataset.id));

function countFor(id){
  if(id==='healthscore') return DB.pacientes.length;
  if(id==='avaliacoes') return DB.avalEnfermagem.length+DB.avalNutricao.length+DB.avalRecepcao.length+DB.avalMedico.length+DB.avalCS.length;
  if(id==='configuracoes') return null;
  if(id==='interacoes') return DB.pacientes.filter(p=>isPatientAtivo(p['ID Paciente'])).length;
  if(id==='protocolos') return DB.pacientes.filter(p=>isPatientAtivo(p['ID Paciente'])).length;
  if(id==='nps') return activeLinkedRows(DB.nps,'ID Paciente').length;
  if(id==='crosssell') return activeLinkedRows(DB.crosssell,'ID Paciente').length;
  if(id==='indicacoes') return DB.pacientes.length;
  const map = {pacientes:DB.pacientes.length, agendamentos:DB.agendamentos.length};
  return map[id]!==undefined ? map[id] : null;
}

function computeKpis(){
  const pac = DB.pacientes;
  const ativos = pac.filter(p=>p['Status Paciente']==='Ativo').length;
  const inativos = pac.filter(p=>p['Status Paciente']==='Inativo').length;
  const finalizados = pac.filter(p=>p['Status Paciente']==='Finalizado').length;
  const health = liveHealthList();
  const critico = health.filter(h=>h.risco==='Crítico').length;
  const hsVals = health.map(h=>h.healthScore).filter(v=>v!==null);
  const hsAvg = hsVals.length ? avgIgnoringNulls(hsVals) : 0;
  const npsVals = DB.nps.map(n=>n['Nota NPS']).filter(v=>typeof v==='number');
  const npsAvg = npsVals.length ? (npsVals.reduce((a,b)=>a+b,0)/npsVals.length) : null;
  const renovacoes = pac.filter(p=> p['Origem']==='Renovação' || renovacoesDoPaciente(p['ID Paciente']) > 0).length;
  const receita = pac.reduce((s,p)=> s + (valorProtocoloAtual(p['ID Paciente'])||0), 0);
  return {ativos, inativos, finalizados, critico, hsAvg, npsAvg, renovacoes, receita, total: pac.length};
}
function groupCount(arr, key){
  const m = {};
  arr.forEach(r=>{ const k = r[key]||'Não informado'; m[k]=(m[k]||0)+1; });
  return Object.entries(m).sort((a,b)=>b[1]-a[1]);
}
function barList(pairs, total){
  const max = Math.max(...pairs.map(p=>p[1]), 1);
  return pairs.map(([label,n])=>`
    <div class="bar-row">
      <div class="lbl" title="${esc(label)}">${esc(label)}</div>
      <div class="track"><div class="fill" style="width:${(n/max*100).toFixed(0)}%"></div></div>
      <div class="n">${n}</div>
    </div>`).join('');
}

function changePatientId(oldId, newIdRaw){
  const newId = String(newIdRaw).trim();
  const p = DB.pacientes.find(p=>p['ID Paciente']===oldId);
  if(!p) return;
  if(!newId || newId===oldId){ openPatientDetail(p); return; }
  if(DB.pacientes.some(x=>x['ID Paciente']===newId)){
    alert(`Já existe um paciente com o ID "${newId}". Escolha outro número.`);
    openPatientDetail(p);
    return;
  }
  p['ID Paciente'] = newId;
  ['interacoesMedica','interacoesEnfermagem','interacoesNutricao','interacoesCS','protocolos','nps','crosssell','healthscore'].forEach(arrayKey=>{
    (DB[arrayKey]||[]).forEach(r=>{ if(r['ID Paciente']===oldId) r['ID Paciente']=newId; });
  });
  DB.indicacoes.forEach(r=>{
    if(r['ID Embaixador']===oldId) r['ID Embaixador']=newId;
    if(r['ID Novo Paciente']===oldId) r['ID Novo Paciente']=newId;
  });
  DB.agendamentos.forEach(r=>{ if(r._convertedPatientId===oldId) r._convertedPatientId=newId; });
  persist();
  renderNav(CURRENT);
  if(RENDERERS[CURRENT]) RENDERERS[CURRENT]();
  openPatientDetail(p);
}

// Lê o formulário de edição do cadastro (#edit-pat-form) e grava tudo de uma vez no paciente ao clicar em Salvar.
function savePatientEdits(patientId){
  const form = document.getElementById('edit-pat-form');
  const p = DB.pacientes.find(x=>x['ID Paciente']===patientId);
  if(!p || !form) return;
  form.querySelectorAll('[name]').forEach(el=>{
    const k = el.name;
    if(k==='Indicado Por Busca' || k==='Valor Protocolo Atual') return;
    let v = el.value;
    if(el.tagName==='SELECT') v = (v===''? null : v);
    else if(el.type==='number') v = (v===''? null : parseFloat(v));
    else v = (v===''? null : v);
    p[k] = v;
  });
  p['Indicado Por'] = parseIndicadoPorId('edit-pat-form');
  if(p['Origem']==='Indicação' && p['Indicado Por']) linkIndicacaoAutomatica(p);
  // Valor do Protocolo Atual mora no registro do protocolo atual (mesmo campo mostrado em Protocolos) —
  // grava direto lá em vez de duplicar o número no cadastro do paciente.
  const valorEl = form.querySelector('[name="Valor Protocolo Atual"]');
  if(valorEl){
    const novoValor = parseMoneyToNumber(valorEl.value);
    const cur = currentProtocoloDoPaciente(patientId);
    if(cur) cur['Valor'] = novoValor;
  }
  persist();
  renderNav(CURRENT);
  if(RENDERERS[CURRENT]) RENDERERS[CURRENT]();
  openPatientDetail(p);
  const msg = document.getElementById('save-pat-msg');
  if(msg){ msg.textContent = '✓ Alterações salvas'; setTimeout(()=>{ if(msg && msg.isConnected) msg.textContent=''; }, 2500); }
}

function linkIndicacaoAutomatica(patient){
  const refId = patient['Indicado Por'];

  const ref = DB.pacientes.find(p=>p['ID Paciente']===refId);
  if(!ref) return;
  let row = patient._indicacaoRid ? DB.indicacoes.find(r=>r._rid===patient._indicacaoRid) : null;
  if(!row){
    row = {'ID Embaixador':refId, 'Nome Embaixador':ref['Nome Completo'], 'Nome Lead':patient['Nome Completo'],
      'Telefone Lead':patient['Telefone Ajustado']||null, 'Data Indicacao':null, 'Status_Lead':'Convertido',
      'Data Conversao':null, 'ID Novo Paciente':patient['ID Paciente'], 'Nível Embaixador':null, 'Recompensa':null, 'Data Recompensa':null};
    row._rid = newRowRid(refId);
    DB.indicacoes.push(row);
    patient._indicacaoRid = row._rid;
  } else {
    row['ID Embaixador'] = refId;
    row['Nome Embaixador'] = ref['Nome Completo'];
    row['Nome Lead'] = patient['Nome Completo'];
    row['ID Novo Paciente'] = patient['ID Paciente'];

// Aplica o valor inicial do protocolo (vindo do formulário de novo paciente/conversão) no registro de
// protocolo recém-criado pelo scaffold, para que Pacientes e Protocolos já nasçam batendo.
function seedValorProtocoloInicial(patientId, valor){
  if(valor===null || valor===undefined) return;
  const row = DB.protocolos.find(r=>r['ID Paciente']===patientId);
  if(row) row['Valor'] = valor;

// Se o paciente já nasce com um Tipo de Protocolo definido no cadastro, o protocolo scaffold criado
// pra ele entra automaticamente como "Em Andamento" (com Início = hoje) — assim ele não fica marcado
// incorretamente como "Sem Protocolo" só porque ninguém abriu a tela de Protocolos pra lançar o
// registro manualmente ainda. Se Tipo de Protocolo não for definido no cadastro, o paciente continua
// em Sem Protocolo normalmente, como esperado.
function seedProtocoloEmAndamentoSeTipoDefinido(patientId, tipoProtocolo){
  if(!tipoProtocolo) return;
  const row = DB.protocolos.find(r=>r['ID Paciente']===patientId);
  if(!row) return;
  if(!row['Status Protocolo']) row['Status Protocolo'] = 'Em Andamento';
  if(!row['Data Iníco']) row['Data Iníco'] = new Date().toISOString().slice(0,10);
}

  if(!medicoEl || !medicoEl.value){

  const rec = {};
  form.querySelectorAll('[name]').forEach(el=>{ if(el.name!=='Indicado Por Busca' && el.name!=='Valor Protocolo Atual') rec[el.name] = el.type==='number' ? (el.value?parseFloat(el.value):null) : el.value || null; });
  const valorInicialEl = form.querySelector('[name="Valor Protocolo Atual"]');
  const valorInicial = valorInicialEl ? parseMoneyToNumber(valorInicialEl.value) : null;
  let newId = String(rec['ID Paciente']||'').trim();
  if(!newId) newId = uid('P', DB.pacientes, 'ID Paciente');
  if(DB.pacientes.some(p=>p['ID Paciente']===newId)){
    alert(`Já existe um paciente com o ID "${newId}". Escolha outro número.`);

  rec['ID Paciente'] = newId;

  persist();
  closeModal();
  renderNav(CURRENT);
  if(RENDERERS[CURRENT]) RENDERERS[CURRENT]();

// Parser de dinheiro tolerante a formato: aceita "9500", "9500,75", "9500.75", "R$ 12.345,67" etc.
// Descobre qual separador (. ou ,) é o decimal olhando qual aparece por último com 1-2 dígitos depois;
// todo o resto (pontos/vírgulas de milhar) é descartado antes de converter para número.
function parseMoneyToNumber(v){
  if(v===null||v===undefined||v==='') return null;
  if(typeof v==='number') return v;
  const s = String(v).trim().replace(/[^\d.,-]/g,'');
  if(s==='' || s==='-') return null;
  const lastComma = s.lastIndexOf(','), lastDot = s.lastIndexOf('.');
  let decSep = null;
  if(lastComma>-1 && lastDot>-1){
    decSep = lastComma>lastDot ? ',' : '.';
  } else if(lastComma>-1){
    decSep = (s.length-lastComma-1)<=2 ? ',' : null;
  } else if(lastDot>-1){
    decSep = (s.length-lastDot-1)<=2 ? '.' : null;
  }
  let intPart, decPart;
  if(decSep){
    const idx = s.lastIndexOf(decSep);
    intPart = s.slice(0,idx).replace(/[.,]/g,'');
    decPart = s.slice(idx+1);
  } else {
    intPart = s.replace(/[.,]/g,'');
    decPart = '';
  }
  const n = parseFloat(intPart + (decPart?('.'+decPart):''));
  return isNaN(n) ? null : n;
}
// Campo de valor monetário para formulários (não é linha de tabela) — mostra em formato contábil R$ 0.000,00
// e reformata sozinho ao sair do campo; o valor é sempre lido de volta com parseMoneyToNumber ao salvar.

}

function saveConvertedPatient(agendamentoRid){
  const form = document.getElementById('new-pat-form');
  const nomeEl = form.querySelector('[name="Nome Completo"]');
  const prontuarioEl = form.querySelector('[name="Nº Prontuário"]');
  const medicoEl = form.querySelector('[name="Medico Responsavel"]');
  if(!nomeEl.value.trim() || !prontuarioEl.value.trim()){
    alert('Nome Completo e Nº Prontuário são obrigatórios para cadastrar um paciente.');
    return;
  }
  if(!medicoEl || !medicoEl.value){
    alert('Médico Responsável é obrigatório para cadastrar um paciente.');
    return;
  }
  const rec = {};
  form.querySelectorAll('[name]').forEach(el=>{ if(el.name!=='Indicado Por Busca' && el.name!=='Valor Protocolo Atual') rec[el.name] = el.type==='number' ? (el.value?parseFloat(el.value):null) : el.value || null; });
  const valorInicialEl = form.querySelector('[name="Valor Protocolo Atual"]');
  const valorInicial = valorInicialEl ? parseMoneyToNumber(valorInicialEl.value) : null;
  let newId = String(rec['ID Paciente']||'').trim();
  if(!newId) newId = uid('P', DB.pacientes, 'ID Paciente');
  if(DB.pacientes.some(p=>p['ID Paciente']===newId)){
    alert(`Já existe um paciente com o ID "${newId}". Escolha outro número.`);
    return;
  }
  rec['ID Paciente'] = newId;
  rec._rid = newId;
  rec['Indicado Por'] = rec['Origem']==='Indicação' ? parseIndicadoPorId('new-pat-form') : null;
  DB.pacientes.push(rec);
  scaffoldPatientRecords(rec);
  seedValorProtocoloInicial(newId, valorInicial);
  seedProtocoloEmAndamentoSeTipoDefinido(newId, rec['Tipo de Protocolo']);
  if(rec['Origem']==='Indicação') linkIndicacaoAutomatica(rec);
  const ag = DB.agendamentos.find(a=>a._rid===agendamentoRid);
  if(ag) ag._convertedPatientId = newId;
  persist();
  closeModal();
  renderNav(CURRENT);
  if(RENDERERS[CURRENT]) RENDERERS[CURRENT]();
}

// ================= INTERAÇÕES (por setor) =================
// A partir de agora, cada setor da clínica (Médica, Enfermagem, Nutrição, CS) tem seu próprio histórico
// de interações com o paciente — cada um traz sua visão para agir de forma mais assertiva pelo sucesso
// do tratamento do paciente. Modelo de histórico: cada "Nova Interação" salva vira UM registro novo
// (nunca sobrescreve o anterior). A tabela principal de cada setor mostra 1 linha por paciente com o
// resumo da última interação daquele setor; clicar na linha abre o histórico completo (mais recente primeiro).
const INTERACAO_SETORES = ['Médica','Enfermagem','Nutrição','CS'];
const INTERACAO_ARRAY_MAP = {'Médica':'interacoesMedica','Enfermagem':'interacoesEnfermagem','Nutrição':'interacoesNutricao','CS':'interacoesCS'};
const INTERACAO_CONFIG_MAP = {'Médica':'medico','Enfermagem':'enfermagem','Nutrição':'nutricao','CS':'cs'};
// intSetorAtivo === null representa a visão "dashboard" (todos os 4 setores juntos, a tela que abre
// ao clicar em "Interações" no menu). Só vira um setor específico quando o usuário escolhe entrar
// individualmente nele (pela barra lateral, pelos cards do dashboard, ou pelas abas dentro da página).
let intSetorAtivo = null;
function interacoesDoPacienteSetor(patientId, setor){
  return (DB[INTERACAO_ARRAY_MAP[setor]]||[]).filter(r=>r['ID Paciente']===patientId);
}
// Interações "reais" (com resumo ou data) do paciente num setor — usado na coluna de Histórico de cada
// setor e (somando os 4 setores) na coluna de Histórico Interações em Pacientes, para não contar
// placeholders vazios do scaffold.
function interacoesMeaningfulCountSetor(patientId, setor){
  return interacoesDoPacienteSetor(patientId, setor).filter(h=> h['Resumo da Interação'] || h['Data da Interação']).length;
}
function interacoesMeaningfulCount(patientId){
  return INTERACAO_SETORES.reduce((sum,setor)=> sum + interacoesMeaningfulCountSetor(patientId, setor), 0);
}
function latestInteracaoSetor(patientId, setor){
  const list = interacoesDoPacienteSetor(patientId, setor);
  if(!list.length) return null;
  const comData = list.filter(r=>r['Data da Interação']);
  if(comData.length) return comData.slice().sort((a,b)=> a['Data da Interação']<b['Data da Interação']?1:-1)[0];
  return list[list.length-1];
}
// Dias desde a última interação com data registrada nesse setor; null = o paciente nunca teve nenhuma
// interação com data nesse setor (ainda mais urgente que "atrasado" — nem um primeiro contato foi lançado).
function diasSemInteracaoSetor(patientId, setor){
  const latest = latestInteracaoSetor(patientId, setor);
  if(!latest || !latest['Data da Interação']) return null;
  const d = new Date(latest['Data da Interação']+'T00:00:00');
  if(isNaN(d.getTime())) return null;
  const hoje = new Date(); hoje.setHours(0,0,0,0);
  return Math.floor((hoje - d) / 86400000);
}
const DIAS_ALERTA_INTERACAO = 31;
let intAlertFiltro = 'Todos';
// Barra de abas compartilhada pelo dashboard e pelas telas individuais de setor — "Visão Geral" volta
// pro dashboard (intSetorAtivo=null), cada setor abre sua tela individual.
function interacoesTabsHtml(){
  const itens = [{key:'', label:'Visão Geral'}].concat(INTERACAO_SETORES.map(s=>({key:s, label:s})));
  return `<div class="tabs-sub">${itens.map(it=>{
    const isAtivo = (it.key||null)===intSetorAtivo;
    const cnt = it.key ? ` (${(DB[INTERACAO_ARRAY_MAP[it.key]]||[]).length})` : '';
    return `<button class="${isAtivo?'active':''}" data-s="${esc(it.key)}">${esc(it.label)}${cnt}</button>`;
  }).join('')}</div>`;
}
function wireInteracoesTabs(){
  document.querySelectorAll('.tabs-sub button[data-s]').forEach(b=> b.onclick = ()=>{ intSetorAtivo = b.dataset.s || null; intAlertFiltro='Todos'; renderInteracoes(); });
}
// Resumo (contagens) de um setor, usado pelos cards do dashboard — mesma lógica de "sem interação /
// atrasado / em dia" usada dentro da tela individual do setor, só que compactada em números.
function setorResumoInteracoes(setor){
  const ativos = DB.pacientes.filter(p=>isPatientAtivo(p['ID Paciente']));
  let nunca=0, atrasados=0;
  ativos.forEach(p=>{
    const dias = diasSemInteracaoSetor(p['ID Paciente'], setor);
    if(dias===null) nunca++;
    else if(dias>DIAS_ALERTA_INTERACAO) atrasados++;
  });
  return {setor, ativos: ativos.length, nunca, atrasados, emDia: ativos.length-nunca-atrasados, semHs: pacientesSemHsSetor(setor)};
}
// Quantos pacientes ativos NUNCA tiveram uma avaliação de Health Score lançada nesse setor (olhando
// todo o histórico de avaliações do setor, não só a última interação). Retorna null se o setor ainda
// não tem Health Score integrado (hoje todos os 4 já têm, mas isso deixa o cálculo à prova de futuro).
function pacientesSemHsSetor(setor){
  const arrayKey = HS_AVAL_ARRAY_POR_SETOR[setor];
  if(!arrayKey) return null;
  const avaliados = new Set((DB[arrayKey]||[]).map(a=>a['ID Paciente']));
  return DB.pacientes.filter(p=>isPatientAtivo(p['ID Paciente']) && !avaliados.has(p['ID Paciente'])).length;
}
// Tela que abre ao clicar em "Interações" no menu (sem escolher um setor específico): um dashboard que
// junta os 4 setores — um card resumo por setor e uma tabela com o status de cada paciente nos 4 setores
// lado a lado. Não força entrar em nenhum setor individual; isso só acontece se o usuário clicar em algo.
function renderInteracoesDashboard(){
  document.getElementById('page-actions').innerHTML = '';
  const resumos = INTERACAO_SETORES.map(setorResumoInteracoes);
  const cols = [
    {key:'ID Paciente', label:'ID'},
    {key:'_prontuario', label:'Prontuário'},
    {key:'Nome Paciente', label:'Paciente'},
    {key:'_medico', label:'Médico Responsável', render:r=>esc(r._medico||'—')},
    ...INTERACAO_SETORES.map(setor=>({key:'_status_'+setor, label:setor, render:r=>r['_status_'+setor]})),
    {key:'_histTotal', label:'Histórico Interações', render:r=>`<span class="pill" style="cursor:pointer" onclick="event.stopPropagation(); openInteracoesResumoPorSetor('${esc(r['ID Paciente'])}')">${r._histTotal} interação(ões) →</span>`},
  ];
  const rows = DB.pacientes.filter(p=>isPatientAtivo(p['ID Paciente'])).map(p=>{
    const row = {'ID Paciente':p['ID Paciente'], _prontuario:prontuarioOf(p['ID Paciente']), 'Nome Paciente':p['Nome Completo'], _medico:p['Medico Responsavel'], _histTotal: interacoesMeaningfulCount(p['ID Paciente'])};
    INTERACAO_SETORES.forEach(setor=>{
      const dias = diasSemInteracaoSetor(p['ID Paciente'], setor);
      let html;
      if(dias===null) html = `<span class="pill inativo">Nunca</span>`;
      else if(dias>DIAS_ALERTA_INTERACAO) html = `<span class="pill inativo">${dias}d ⚠️</span>`;
      else html = `<span class="pill ativo">${dias}d</span>`;
      row['_status_'+setor] = html;
    });
    return row;
  });
  document.getElementById('content').innerHTML = `
    ${interacoesTabsHtml()}
    <div class="note">Visão geral dos 4 setores juntos — Médica, Enfermagem, Nutrição e CS. Cada um traz sua própria visão sobre o paciente, pelo sucesso do tratamento dele. Clique num card de setor abaixo para entrar só naquele setor, ou clique num paciente na tabela para ver o resumo dele nos 4 setores e abrir o histórico completo de qualquer um.</div>
    <div class="kpi-grid">
      ${resumos.map(r=>`
        <div class="kpi-card" style="cursor:pointer;" onclick="irParaSetorInteracoes('${esc(r.setor)}')">
          <div class="label">${esc(r.setor)}</div>
          <div class="value">${r.ativos}</div>
          <div class="small" style="margin-top:8px;line-height:1.6;">
            <span style="color:var(--danger);font-weight:600;">${r.nunca} nunca</span> ·
            <span style="color:var(--warn);font-weight:600;">${r.atrasados} atrasado(s)</span> ·
            <span style="color:var(--ok);font-weight:600;">${r.emDia} em dia</span>
          </div>
          ${r.semHs!==null ? `<div class="small" style="margin-top:6px;color:${r.semHs>0?'var(--hs)':'var(--ok)'};font-weight:600;">❤️ ${r.semHs} sem Health Score</div>` : ''}
          <div class="small" style="margin-top:8px;">Ver setor →</div>
        </div>`).join('')}
    </div>
    <div class="card">
      <h3>Pacientes por setor</h3>
      <div class="small" style="margin-bottom:10px;">Dias sem interação em cada setor, lado a lado — ⚠️ quando passa de ${DIAS_ALERTA_INTERACAO} dias. Clique numa linha para ver o resumo completo do paciente por setor.</div>
      <div id="tbl-int-dash"></div>
    </div>`;
  wireInteracoesTabs();
  renderTable({containerId:'tbl-int-dash', columns:cols, rows,
    searchKeys:['Nome Paciente','ID Paciente','_prontuario','_medico'],
    rowClick: r=>openInteracoesResumoPorSetor(r['ID Paciente']),
    emptyMsg:'Nenhum paciente ativo.'});
}
function renderInteracoes(){
  if(intSetorAtivo===null){ renderInteracoesDashboard(); return; }
  renderInteracoesSetor();
}
// Tela individual de um setor (Médica, Enfermagem, Nutrição ou CS) — a mesma tela detalhada de sempre,
// só aberta quando o usuário escolhe entrar num setor específico (nunca automaticamente).
function renderInteracoesSetor(){
  const setor = intSetorAtivo;
  document.getElementById('page-actions').innerHTML = `<button class="btn" onclick="openNewInteracaoForm()">+ Nova Interação (${esc(setor)})</button>`;
  const cols = [
    {key:'ID Paciente', label:'ID'},
    {key:'_prontuario', label:'Prontuário'},
    {key:'Nome Paciente', label:'Paciente'},
    {key:'Data Início Tratamento', label:'Início Tratamento', render:r=>fmtDate(r['Data Início Tratamento'])},
    {key:'Data Final Tratamento', label:'Fim Tratamento', render:r=>fmtDate(r['Data Final Tratamento'])},
    {key:'Data da Interação', label:'Última Interação', render:r=>fmtDate(r['Data da Interação'])},
    {key:'_diasSemInteracao', label:'Dias sem Interação', render:r=>{
      if(r._diasSemInteracao===null) return `<span class="pill inativo">Nunca interagiu</span>`;
      if(r._diasSemInteracao>DIAS_ALERTA_INTERACAO) return `<span class="pill inativo">${r._diasSemInteracao} dias ⚠️</span>`;
      return `${r._diasSemInteracao} dia(s)`;
    }},
    {key:'Responsável', label:'Responsável', render:r=>esc(r['Responsável']||'—')},
    {key:'Canal', label:'Canal', render:r=>esc(r['Canal']||'—')},
    {key:'Resumo da Interação', label:'Resumo', render:r=>`${r._latestTemHs?'<span title="Health Score preenchido nesta interação" style="margin-right:4px;">❤️</span>':''}${esc(r['Resumo da Interação']||'—')}`},
    {key:'_histCount', label:'Histórico', render:r=>`<span class="pill">${r._histCount} interação(ões) →</span>`},
  ];
  const allRows = DB.pacientes.filter(p=>isPatientAtivo(p['ID Paciente'])).map(p=>{
    const latest = latestInteracaoSetor(p['ID Paciente'], setor) || {};
    const protoAtual = currentProtocoloDoPaciente(p['ID Paciente']);
    return {
      'ID Paciente': p['ID Paciente'],
      _prontuario: prontuarioOf(p['ID Paciente']),
      'Nome Paciente': p['Nome Completo'],
      _latestRid: latest._rid || null,
      _latestTemHs: HS_AVAL_ARRAY_POR_SETOR[setor] && latest._rid ? !!findAvalHsByInteracaoRid(setor, latest._rid) : false,
      'Data Início Tratamento': protoAtual ? (protoAtual['Data Iníco'] ?? null) : null,
      'Data Final Tratamento': protoAtual ? (protoAtual['Data Final'] ?? null) : null,
      'Data da Interação': latest['Data da Interação'] ?? null,
      _diasSemInteracao: diasSemInteracaoSetor(p['ID Paciente'], setor),
      // No setor Médica o Responsável não é escolhido à mão — é sempre o Médico Responsável do
      // cadastro do paciente, então mostramos o valor atual do cadastro em vez do que foi salvo no
      // registro (se o médico do paciente mudar depois, a tabela já reflete o médico certo).
      'Responsável': setor==='Médica' ? (p['Medico Responsavel'] ?? null) : (latest['Responsável'] ?? null),
      'Canal': latest['Canal'] ?? null,
      'Resumo da Interação': latest['Resumo da Interação'] ?? null,
      _histCount: interacoesMeaningfulCountSetor(p['ID Paciente'], setor),
    };
  });
  const nuncaInteragiu = allRows.filter(r=>r._diasSemInteracao===null);
  const atrasados = allRows.filter(r=>r._diasSemInteracao!==null && r._diasSemInteracao>DIAS_ALERTA_INTERACAO);
  const emDia = allRows.filter(r=>r._diasSemInteracao!==null && r._diasSemInteracao<=DIAS_ALERTA_INTERACAO);
  const prioridade = atrasados.concat(nuncaInteragiu.map(r=>({...r, _diasSemInteracao:Infinity})))
    .sort((a,b)=> b._diasSemInteracao - a._diasSemInteracao);
  document.getElementById('content').innerHTML = `
    ${interacoesTabsHtml()}
    <div class="note">Cada setor traz sua própria visão sobre o paciente — o objetivo é agir de forma mais assertiva pelo sucesso do tratamento dele. Um paciente satisfeito compra mais, indica mais, e mantém o negócio saudável e lucrativo.</div>
    <div class="kpi-grid">
      <div class="kpi-card"><div class="label">Pacientes Ativos</div><div class="value">${allRows.length}</div></div>
      <div class="kpi-card"><div class="label">Sem Interação (nunca)</div><div class="value danger">${nuncaInteragiu.length}</div></div>
      <div class="kpi-card"><div class="label">Atrasados (+${DIAS_ALERTA_INTERACAO} dias)</div><div class="value warn">${atrasados.length}</div></div>
      <div class="kpi-card"><div class="label">Em dia</div><div class="value ok">${emDia.length}</div></div>
    </div>
    ${prioridade.length ? `<div class="card" style="border-left:4px solid var(--danger);">
      <h3>⚠️ Prioridade de ação — ${esc(setor)} sem interação há mais de ${DIAS_ALERTA_INTERACAO} dias (ou nunca)</h3>
      <div class="small" style="margin-bottom:8px;">Interagir é como cuidamos da satisfação do paciente — esses são os que mais precisam de contato agora. Clique para ver o histórico e lançar uma interação.</div>
      ${prioridade.slice(0,8).map(r=>`
        <div class="bar-row" style="cursor:pointer" onclick="openInteracaoHistorico('${esc(r['ID Paciente'])}')">
          <div class="lbl" style="width:220px;" title="${esc(r['Nome Paciente'])}">${esc(r['Nome Paciente'])}</div>
          <div class="track"><div class="fill" style="background:var(--danger);width:${r._diasSemInteracao===Infinity?100:Math.min(100,(r._diasSemInteracao/90*100)).toFixed(0)}%"></div></div>
          <div class="n">${r._diasSemInteracao===Infinity?'Nunca':r._diasSemInteracao+'d'}</div>
        </div>`).join('')}
      ${prioridade.length>8?`<div class="small">+ ${prioridade.length-8} outro(s) paciente(s) precisando de contato.</div>`:''}
    </div>` : ''}
    <div class="note">Uma linha por paciente, com o resumo da <b>última interação do setor ${esc(setor)}</b>. Clique em qualquer linha para abrir o <b>histórico completo</b> desse setor — todas as interações já feitas (data, responsável, canal e resumo) — e lançar uma nova. <b>Início/Fim Tratamento</b> vêm automaticamente do protocolo vigente do paciente (aba Protocolos) — para corrigir essas datas, edite lá. Pacientes com mais de ${DIAS_ALERTA_INTERACAO} dias sem interação (ou que nunca tiveram uma) neste setor aparecem com alerta — use os filtros abaixo para agir. ${setor==='Médica' ? '<b>Responsável</b> aqui é sempre o Médico Responsável cadastrado no paciente — não é escolhido à mão; para trocar, edite o cadastro do paciente. ' : ''}${INATIVO_NOTE}</div>
    <div class="toolbar">
      <span class="chip ${intAlertFiltro==='Todos'?'active':''}" data-f="Todos">Todos (${allRows.length})</span>
      <span class="chip critico ${intAlertFiltro==='Nunca'?'active':''}" data-f="Nunca">Sem Interação (${nuncaInteragiu.length})</span>
      <span class="chip atencao ${intAlertFiltro==='Atrasado'?'active':''}" data-f="Atrasado">Atrasados (${atrasados.length})</span>
      <span class="chip saudavel ${intAlertFiltro==='Em dia'?'active':''}" data-f="Em dia">Em dia (${emDia.length})</span>
      ${toolbarSearch(q=>tbl.setQuery(q), 'Buscar por paciente, prontuário, responsável, resumo...')}
    </div>
    <div id="tbl-int"></div>`;
  wireInteracoesTabs();
  document.querySelectorAll('.chip[data-f]').forEach(c=> c.onclick=()=>{ intAlertFiltro=c.dataset.f; renderInteracoes(); });
  let rows = allRows;
  if(intAlertFiltro==='Nunca') rows = nuncaInteragiu;
  else if(intAlertFiltro==='Atrasado') rows = atrasados;

// Lista o histórico completo de interações de um paciente NO SETOR ATIVO (mais recente primeiro), com
// cada campo editável direto ali, e um atalho para lançar mais uma interação para esse mesmo paciente.
// Setores que hoje lançam avaliação de Health Score junto com a interação (Adesão/Resultado Clínico) —
// aponta pro array de Avaliações (o mesmo já usado em Avaliações > Setor) que recebe essa nota.
const HS_AVAL_ARRAY_POR_SETOR = { 'Médica':'avalMedico', 'Nutrição':'avalNutricao', 'CS':'avalCS', 'Enfermagem':'avalEnfermagem' };
// Localiza a avaliação de Health Score lançada junto com uma interação específica (o link é feito na
// hora de salvar, via _interacaoRid) — usado para mostrar o selo "Health Score preenchido" no card
// daquela interação no histórico.
function findAvalHsByInteracaoRid(setor, rid){
  const arrayKey = HS_AVAL_ARRAY_POR_SETOR[setor];
  if(!arrayKey) return null;
  return (DB[arrayKey]||[]).find(a=>a['_interacaoRid']===rid) || null;
}
function hsBadgeHtml(setor, interacaoRid){
  if(!HS_AVAL_ARRAY_POR_SETOR[setor]) return '';
  const aval = findAvalHsByInteracaoRid(setor, interacaoRid);
  if(!aval || aval['Nota (0-10)']===null || aval['Nota (0-10)']===undefined) return '';
  const partes = [];
  if(aval['Adesão (0-10)']!==null && aval['Adesão (0-10)']!==undefined) partes.push(`Adesão ${round1(aval['Adesão (0-10)'])}`);
  if(aval['Resultado Clínico (0-10)']!==null && aval['Resultado Clínico (0-10)']!==undefined) partes.push(`Resultado Clínico ${round1(aval['Resultado Clínico (0-10)'])}`);
  const detalhe = partes.length ? ` — ${partes.join(' · ')}` : '';
  return `<div style="margin-bottom:8px;"><span class="pill" style="background:var(--hs-light);color:var(--hs);font-weight:600;" title="Nota geral ${round1(aval['Nota (0-10)'])}/10${detalhe}">❤️ Health Score preenchido · ${round1(aval['Nota (0-10)'])}/10</span></div>`;
}
function openInteracaoHistorico(patientId){
  const p = DB.pacientes.find(p=>p['ID Paciente']===patientId);
  if(!p) return;
  const setor = intSetorAtivo;
  const arrayKey = INTERACAO_ARRAY_MAP[setor];
  const configKey = INTERACAO_CONFIG_MAP[setor];
  const hist = interacoesDoPacienteSetor(patientId, setor).slice().sort((a,b)=>{
    const da=a['Data da Interação']||'', db=b['Data da Interação']||'';
    if(da===db) return 0;
    if(!da) return 1;
    if(!db) return -1;
    return da<db?1:-1;
  });
  const entradas = hist.filter(r=> r['Resumo da Interação'] || r['Data da Interação'] || r['Canal'] || r['Responsável']);
  const itemHtml = entradas.map(r=>`
    <div class="card" style="margin-bottom:10px;">
      ${hsBadgeHtml(setor, r._rid)}
      <div class="detail-grid">
        <div class="f"><span class="k">Data da Interação</span><span class="v">${inlineField(arrayKey, r._rid, 'Data da Interação', r['Data da Interação'], 'date')}</span></div>
        <div class="f"><span class="k">Responsável</span><span class="v">${setor==='Médica' ? esc(p['Medico Responsavel']||'—') : inlineSelect(configKey, r['Responsável'], arrayKey, r._rid)}</span></div>
        <div class="f"><span class="k">Tipo</span><span class="v">${inlineSelect('tipoContato', r['Tipo de Contato'], arrayKey, r._rid)}</span></div>
        <div class="f"><span class="k">Canal</span><span class="v">${inlineSelect('canal', r['Canal'], arrayKey, r._rid)}</span></div>
      </div>
      <div style="margin-top:8px;"><span class="k" style="display:block;margin-bottom:4px;">Resumo</span>${resumoInteracaoReadonlyHtml(r['Resumo da Interação'])}</div>
    </div>
  `).join('');
  openModal(`
    <h3>Histórico de Interações — ${esc(setor)} · ${esc(p['Nome Completo'])} <span class="small">(${esc(p['ID Paciente'])})</span></h3>
    <div class="small" style="margin-bottom:10px;">Todas as interações do setor <b>${esc(setor)}</b> registradas com este paciente, da mais recente para a mais antiga. Data, Responsável, Tipo e Canal são editáveis direto aqui. O <b>Resumo</b> é travado depois de salvo — não pode ser editado, para preservar o registro fiel do que foi escrito.</div>
    <button class="btn" style="margin-bottom:14px;" onclick="openNewInteracaoForm('${esc(patientId)}')">+ Nova Interação de ${esc(setor)} para este paciente</button>
    ${entradas.length ? itemHtml : `<div class="small">Nenhuma interação de ${esc(setor)} registrada ainda — clique em "+ Nova Interação de ${esc(setor)} para este paciente" acima para começar o histórico.</div>`}
  `, patientId);
}
// Visão combinada dos 4 setores para um paciente — usada a partir de Pacientes (coluna Histórico
// Interações) e do cartão de Interações no cadastro do paciente, já que ali não há um "setor atual".
// Cada linha leva para o histórico completo daquele setor.
// Visão combinada dos 4 setores para um paciente. Clicar num setor NÃO fecha o modal nem redireciona
// para a tela do setor — expande ali mesmo, com todas as interações daquele setor (editáveis, igual ao
// histórico normal). Só sai daqui se o usuário explicitamente quiser ("Ver histórico completo em X →").
function openInteracoesResumoPorSetor(patientId){
  const p = DB.pacientes.find(p=>p['ID Paciente']===patientId);
  if(!p) return;
  const secoes = INTERACAO_SETORES.map(setor=>{
    const arrayKey = INTERACAO_ARRAY_MAP[setor];
    const configKey = INTERACAO_CONFIG_MAP[setor];
    const hist = interacoesDoPacienteSetor(patientId, setor).slice().sort((a,b)=>{
      const da=a['Data da Interação']||'', db=b['Data da Interação']||'';
      if(da===db) return 0;
      if(!da) return 1;
      if(!db) return -1;
      return da<db?1:-1;
    });
    const entradas = hist.filter(r=> r['Resumo da Interação'] || r['Data da Interação'] || r['Canal'] || r['Responsável']);
    const latest = entradas[0] || null;
    const detalheId = 'int-resumo-' + setor.replace(/[^a-zA-Z0-9]/g,'');
    const itemHtml = entradas.length ? entradas.map(r=>`
      <div class="card" style="margin:8px 0 0;background:#fafcfb;">
        ${hsBadgeHtml(setor, r._rid)}
        <div class="detail-grid">
          <div class="f"><span class="k">Data da Interação</span><span class="v">${inlineField(arrayKey, r._rid, 'Data da Interação', r['Data da Interação'], 'date')}</span></div>
          <div class="f"><span class="k">Responsável</span><span class="v">${setor==='Médica' ? esc(p['Medico Responsavel']||'—') : inlineSelect(configKey, r['Responsável'], arrayKey, r._rid)}</span></div>
          <div class="f"><span class="k">Tipo</span><span class="v">${inlineSelect('tipoContato', r['Tipo de Contato'], arrayKey, r._rid)}</span></div>
          <div class="f"><span class="k">Canal</span><span class="v">${inlineSelect('canal', r['Canal'], arrayKey, r._rid)}</span></div>
        </div>
        <div style="margin-top:8px;"><span class="k" style="display:block;margin-bottom:4px;">Resumo</span>${resumoInteracaoReadonlyHtml(r['Resumo da Interação'])}</div>
      </div>`).join('') : `<div class="small" style="margin-top:8px;">Nenhuma interação de ${esc(setor)} registrada ainda.</div>`;
    return `<div class="card" style="margin-bottom:10px;">
      <div style="display:flex;justify-content:space-between;align-items:center;cursor:pointer;" onclick="toggleInteracaoResumoDetalhe('${detalheId}')">
        <b>${esc(setor)}</b><span class="pill">${entradas.length} interação(ões) <span id="${detalheId}-chevron">▾</span></span>
      </div>
      <div class="small" style="margin-top:6px;">${latest ? fmtDate(latest['Data da Interação'])+' — '+esc(latest['Resumo da Interação']||'') : 'Nenhuma interação registrada ainda.'}</div>
      <div id="${detalheId}" style="display:none;margin-top:6px;border-top:1px solid var(--line);padding-top:8px;">
        ${itemHtml}
        <button class="btn ghost" style="margin-top:8px;" onclick="closeModal(); irParaInteracaoSetor('${esc(patientId)}','${esc(setor)}')">Ver histórico completo em ${esc(setor)} →</button>
      </div>
    </div>`;
  }).join('');
  openModal(`
    <h3>Histórico de Interações por Setor — ${esc(p['Nome Completo'])} <span class="small">(${esc(p['ID Paciente'])})</span></h3>
    <div class="small" style="margin-bottom:10px;">Cada setor da clínica registra sua própria visão sobre o paciente. Clique num setor para ler as interações aqui mesmo, sem precisar ir pra tela dele — os campos abaixo já são editáveis direto aqui.</div>
    ${secoes}
  `, patientId);
}
// Abre/fecha o histórico de um setor dentro do modal combinado, sem fechar o modal nem trocar de tela.
function toggleInteracaoResumoDetalhe(id){
  const el = document.getElementById(id);
  if(!el) return;
  const aberto = el.style.display !== 'none';
  el.style.display = aberto ? 'none' : '';
  const chev = document.getElementById(id+'-chevron');
  if(chev) chev.textContent = aberto ? '▾' : '▴';
}

// Gera um id HTML seguro a partir do nome do campo (usado para amarrar o select ao campo de detalhe
// condicional, ex.: "Engajamento - Efeito Colateral" -> "Engajamento_Efeito_Colateral").
function hsSlug(s){
  return String(s).replace(/[^a-zA-Z0-9]+/g,'_');
}
// Mostra/oculta o campo de detalhe condicional (ex.: "Qual foi o efeito colateral?") conforme a
// resposta escolhida no select associado; limpa o valor quando o campo é ocultado.
function toggleHsDetalhe(selectEl){
  const targetId = selectEl.dataset.detalheTarget;
  if(!targetId) return;
  const wrap = document.getElementById(targetId);
  if(!wrap) return;
  const show = selectEl.value === selectEl.dataset.detalheQuando;
  wrap.style.display = show ? '' : 'none';
  if(!show){ const inp = wrap.querySelector('input'); if(inp) inp.value=''; }
}
function hsOpcoesHtml(pergunta){
  return `<option value="">—</option>` + pergunta.opcoes.map(o=>`<option value="${esc(o.v)}">${esc(o.v)}</option>`).join('');
}
function hsPontos(pergunta, valor){
  if(!valor) return null;
  const opt = pergunta.opcoes.find(o=>o.v===valor);
  return opt ? opt.pts : null;
}
// Nota do bloco (0-10) = média das perguntas respondidas dentro dele; se nenhuma foi respondida, null
// (bloco ignorado, não gera avaliação).
function hsBlocoScore(setor, blocoKey, rec){
  const blocos = HS_BLOCOS_POR_SETOR[setor];
  const bloco = blocos ? blocos[blocoKey] : null;
  if(!bloco) return null;
  const pontos = bloco.perguntas.map(q=>hsPontos(q, rec[q.field])).filter(v=>v!==null);
  return pontos.length ? avgIgnoringNulls(pontos) : null;
}
function hsBlocoHtml(setor, blocoKey){
  const blocos = HS_BLOCOS_POR_SETOR[setor];

// preselectPatientId: quando aberto clicando num paciente já existente na lista, vem pré-preenchido.

// A interação criada aqui sempre entra no setor ativo no momento (intSetorAtivo) — Responsável é escolhido
// a partir do time daquele setor (ex.: só médicos para o setor Médica, só o time de Nutrição para Nutrição).

// No setor Médica, o Responsável não é escolhido à mão — assim que um paciente é digitado/selecionado
// no campo de busca, o campo (travado) já mostra o Médico Responsável cadastrado nele.
function wireNovaInteracaoMedicoAutofill(formId){
  const form = document.getElementById(formId);
  if(!form) return;
  const buscaEl = form.querySelector('[name="Paciente Busca"]');
  const respEl = document.getElementById('int-resp-medico');
  if(!buscaEl || !respEl) return;
  const sync = ()=>{
    const m = /^(\S+)\s+—/.exec((buscaEl.value||'').trim());
    const p = m ? DB.pacientes.find(p=>p['ID Paciente']===m[1]) : null;
    respEl.value = (p && p['Medico Responsavel']) ? p['Medico Responsavel'] : '—';
  };
  buscaEl.addEventListener('input', sync);
  buscaEl.addEventListener('change', sync);
}
// Ao salvar, sempre cria um novo registro de histórico (nunca edita um existente) no array do setor ativo
// no momento do lançamento, e em seguida abre o histórico do paciente para já mostrar a interação recém-
// lançada dentro do contexto completo.
// Se alguma pergunta dos blocos de Health Score tem um campo de detalhe condicional (ex.: "Relatou
// efeito colateral? Sim" -> exige descrever qual), valida que o detalhe foi preenchido antes de
// permitir salvar a interação. Retorna true se pode salvar, ou mostra um alert e retorna false.
function validarDetalhesHsObrigatorios(setor, rec){
  const blocos = HS_BLOCOS_POR_SETOR[setor];
  if(!blocos) return true;
  for(const blocoKey of ['adesao','resultado']){
    const bloco = blocos[blocoKey];
    if(!bloco) continue;
    for(const q of bloco.perguntas){
      if(q.detalhe && rec[q.field]===q.detalhe.quando && !(rec[q.detalhe.field]||'').trim()){
        alert(`Você respondeu "${q.detalhe.quando}" em "${q.label}" — preencha o campo "${q.detalhe.label}" antes de salvar.`);
        return false;
      }
    }
  }
  return true;
}
function saveNewInteracao(){
  const setor = intSetorAtivo;
  const arrayKey = INTERACAO_ARRAY_MAP[setor];
  const form = document.getElementById('new-int-form');
  const rec = {};
  form.querySelectorAll('[name]').forEach(el=>{ if(el.name!=='Paciente Busca') rec[el.name]=el.value||null; });
  if(!validarDetalhesHsObrigatorios(setor, rec)) return;
  const busca = (form.querySelector('[name="Paciente Busca"]')||{}).value || '';
  const m = /^(\S+)\s+—/.exec(busca.trim());
  const p = m ? DB.pacientes.find(p=>p['ID Paciente']===m[1]) : null;
  if(!p){
    alert('Selecione um paciente válido: digite o nome ou ID e escolha uma das sugestões da lista.');
    return;
  }
  rec['ID Paciente'] = p['ID Paciente'];
  rec['Nome Paciente'] = p['Nome Completo'];
  // No setor Médica não existe select de Responsável no formulário (é travado) — grava direto o
  // Médico Responsável do cadastro do paciente escolhido.
  if(setor==='Médica') rec['Responsável'] = p['Medico Responsavel'] || null;
  rec['Data Início Tratamento'] = null;
  rec['Semana do Tratamento'] = null;
  rec._rid = newRowRid(rec['ID Paciente']);
  // Se Adesão e/ou Resultado Clínico foram preenchidos (hoje disponível nos setores Médica e
  // Nutrição), converte as respostas em nota e lança automaticamente uma avaliação de Health Score
  // junto com a interação — sem precisar ir até Avaliações separadamente. Se nada foi respondido, só
  // a interação é salva.
  let notaHsLancada = null;
  if(HS_BLOCOS_POR_SETOR[setor]){
    const adesaoScore = hsBlocoScore(setor, 'adesao', rec);
    const resultadoScore = hsBlocoScore(setor, 'resultado', rec);
    const notaFinal = avgIgnoringNulls([adesaoScore, resultadoScore]);
    if(notaFinal!==null){
      DB[HS_AVAL_ARRAY_POR_SETOR[setor]].push({
        'ID Paciente': p['ID Paciente'],
        'Nome Paciente': p['Nome Completo'],
        'Data Avaliação': rec['Data da Interação'] || null,
        'Semana': null,
        'Nota (0-10)': notaFinal,
        'Observação': rec['Resumo da Interação'] || null,
        'Adesão (0-10)': adesaoScore,
        'Resultado Clínico (0-10)': resultadoScore,
        '_interacaoRid': rec._rid,
      });
      notaHsLancada = notaFinal;
    }
  }
  DB[arrayKey].push(rec);
  persist();
  renderNav(CURRENT);
  if(RENDERERS[CURRENT]) RENDERERS[CURRENT]();
  openInteracaoHistorico(p['ID Paciente']);
  // Confirmação discreta (some sozinha) de que a avaliação de Health Score também foi lançada — não
  // bloqueia a tela como um alert().
  if(notaHsLancada!==null){
    const box = document.getElementById('modal-box');
    if(box){
      const aviso = document.createElement('div');
      aviso.className = 'small';
      aviso.style.cssText = 'background:#fdf3fa;color:#c026d3;padding:8px 12px;border-radius:8px;margin-bottom:14px;font-weight:600;';
      aviso.textContent = `❤️ Avaliação de Health Score também registrada (nota ${round1(notaHsLancada)}/10).`;
      box.insertBefore(aviso, box.children[1] || null);
      setTimeout(()=>{ if(aviso.isConnected) aviso.remove(); }, 5000);
    }
  }
}

// Todos os protocolos já feitos por um paciente (histórico completo, ligado pelo ID Paciente) —
// usado no card "Protocolos" do cadastro do paciente para mostrar todo o consumo do cliente.
function protocolosDoPaciente(patientId){

}
function openProtocoloHistorico(patientId){

  openModal(`

function verPacienteNaAbaProtocolos(patientId){
  closeModal();
  go('protocolos');

    const s = document.querySelector('#content .toolbar input.search');

// Protocolo "atual" de um paciente: prioriza o que está em andamento (tem início, sem final ainda);
// se todos já terminaram, usa o mais recente por data de início; se não há nenhum ainda, cai no
// placeholder vazio (para manter um _rid válido de edição inline).
function currentProtocoloDoPaciente(patientId){
  const hist = protocolosDoPaciente(patientId);
  if(!hist.length) return null;
  const emAndamento = hist.filter(r=>r['Data Iníco'] && !r['Data Final']);
  const pool = emAndamento.length ? emAndamento : hist.filter(r=>r['Data Iníco']);
  if(pool.length) return pool.slice().sort((a,b)=> a['Data Iníco']<b['Data Iníco']?1:-1)[0];
  return hist[hist.length-1];
}
// Valor do protocolo ATUAL do paciente — é o mesmo registro usado em Pacientes e em Protocolos,
// então os dois sempre batem (não são dois números soltos, é o mesmo campo visto de dois lugares).
function valorProtocoloAtual(patientId){
  const cur = currentProtocoloDoPaciente(patientId);
  return cur ? (cur['Valor']===undefined ? null : cur['Valor']) : null;
}
// LTV = soma do Valor de TODOS os protocolos (atual + histórico) já feitos pelo paciente.
function ltvDoPaciente(patientId){
  return protocolosDoPaciente(patientId).reduce((sum,r)=> sum + (parseFloat(r['Valor'])||0), 0);
}
// Protocolos "reais" (com início, final, especialidade ou valor) do paciente — usado por Renovação e pela
// coluna de Histórico em Pacientes, para não contar placeholders vazios do scaffold.
function protocolosMeaningfulCount(patientId){
  return protocolosDoPaciente(patientId).filter(r=>r['Data Iníco']||r['Especialidade']||r['Data Final']||r['Valor']||r['Status Protocolo']).length;
}
// Nº de renovações = quantos protocolos "reais" o paciente já teve, menos o primeiro.
function renovacoesDoPaciente(patientId){
  return Math.max(0, protocolosMeaningfulCount(patientId) - 1);
}
// Só deveria existir 1 protocolo "Em Andamento" por paciente. Se houver mais de um, é uma divergência
// (alguém provavelmente esqueceu de marcar o anterior como Finalizado) — usado para o alerta ⚠️.
function protocolosEmAndamentoCount(patientId){
  return protocolosDoPaciente(patientId).filter(r=>r['Status Protocolo']==='Em Andamento').length;
}
// Classificação do paciente (não do protocolo em si) em um dos 3 baldes do mini-dashboard: usa o
// protocolo ATUAL do paciente — se ele tem um Status definido (Em Andamento/Finalizado), cai nesse
// balde; se não tem protocolo algum, ou o atual está sem Status definido, cai em "Sem Protocolo".
function protocoloBucketDoPaciente(patientId){
  const cur = currentProtocoloDoPaciente(patientId);
  if(cur && cur['Status Protocolo']==='Em Andamento') return 'Em Andamento';
  if(cur && cur['Status Protocolo']==='Finalizado') return 'Finalizado';
  return 'Sem Protocolo';
}

// Ao escolher o paciente no campo de busca, preenche automaticamente Tipo de Protocolo, Modalidade, CS
// Responsável e Nutricionista Responsável com o que já está no cadastro dele (evita redigitar algo que
// já existe) — mas todos continuam editáveis, para quando o cadastro ainda não tiver um valor definido
// (útil pra completar o cadastro por aqui mesmo) ou precisar ser corrigido nesta tela.
function wireNewProtocoloTipoAutofill(formId){
  const form = document.getElementById(formId);
  if(!form) return;
  const buscaEl = form.querySelector('[name="Paciente Busca"]');
  const camposAutofill = [
    {field:'Tipo de Protocolo', cadastro:'Tipo de Protocolo'},
    {field:'Modalidade', cadastro:'Modalidade'},
    {field:'CS Responsavel', cadastro:'CS Responsavel'},
    {field:'Nutricionista Responsavel', cadastro:'Nutricionista Responsavel'},
  ];
  if(!buscaEl) return;
  const sync = ()=>{
    const m = /^(\S+)\s+—/.exec((buscaEl.value||'').trim());
    const p = m ? DB.pacientes.find(p=>p['ID Paciente']===m[1]) : null;
    if(!p) return;
    camposAutofill.forEach(({field,cadastro})=>{
      const el = form.querySelector(`[name="${field}"]`);
      if(el && p[cadastro]) el.value = p[cadastro];
    });
  };
  buscaEl.addEventListener('input', sync);
  buscaEl.addEventListener('change', sync);
}
// Ao salvar, sempre cria um novo registro de histórico (nunca sobrescreve um protocolo anterior) e
// reabre o histórico de protocolos do paciente, mostrando o novo lançamento no contexto completo.
function saveNewProtocolo(){
  const form = document.getElementById('new-prot-form');
  const rec = {};
  // Tipo de Protocolo, Modalidade, CS Responsável e Nutricionista Responsável moram no cadastro do
  // paciente (não no protocolo em si) — capturamos à parte para gravar lá, em vez de no registro do
  // protocolo.
  const CADASTRO_FIELDS = ['Tipo de Protocolo','Modalidade','CS Responsavel','Nutricionista Responsavel'];
  const cadastroValores = {};
  form.querySelectorAll('[name]').forEach(el=>{
    if(el.name==='Paciente Busca') return;
    if(CADASTRO_FIELDS.includes(el.name)){ cadastroValores[el.name] = el.value || null; return; }
    if(el.name==='Valor'){ rec['Valor'] = parseMoneyToNumber(el.value); return; }
    rec[el.name] = el.type==='number' ? (el.value===''? null : parseFloat(el.value)) : (el.value || null);
  });
  const busca = (form.querySelector('[name="Paciente Busca"]')||{}).value || '';
  const m = /^(\S+)\s+—/.exec(busca.trim());
  const p = m ? DB.pacientes.find(p=>p['ID Paciente']===m[1]) : null;
  if(!p){
    alert('Selecione um paciente válido: digite o nome ou ID e escolha uma das sugestões da lista.');
    return;
  }
  rec['ID Paciente'] = p['ID Paciente'];
  rec['Nome Paciente'] = p['Nome Completo'];
  rec._rid = newRowRid(rec['ID Paciente']);
  DB.protocolos.push(rec);
  // A escolha feita aqui atualiza o cadastro do paciente, mantendo Pacientes e Protocolos sempre
  // batendo — inclusive completando o cadastro por aqui mesmo se algum desses campos ainda estava em
  // branco lá.
  CADASTRO_FIELDS.forEach(field=>{ if(cadastroValores[field]) p[field] = cadastroValores[field]; });
  persist();
  renderNav(CURRENT);
  if(RENDERERS[CURRENT]) RENDERERS[CURRENT]();
  openProtocoloHistorico(p['ID Paciente']);
}

// Lista o histórico completo de leads indicados por um embaixador (mais recente primeiro), cada campo
// editável direto ali, e um atalho para lançar mais uma indicação para esse mesmo embaixador.
function openIndicacaoHistorico(patientId){
  const p = DB.pacientes.find(p=>p['ID Paciente']===patientId);
  if(!p) return;
  const hist = indicacoesDoEmbaixador(patientId).slice().sort((a,b)=>{
    const da=a['Data Indicacao']||'', db=b['Data Indicacao']||'';
    if(da===db) return 0;
    if(!da) return 1;
    if(!db) return -1;
    return da<db?1:-1;
  });
  const entradas = hist.filter(r=> r['Nome Lead'] || r['Telefone Lead'] || r['Status_Lead']);
  const itemHtml = entradas.map(r=>`
    <div class="card" style="margin-bottom:10px;">
      <div class="detail-grid">
        <div class="f"><span class="k">Lead Indicado</span><span class="v">${inlineField('indicacoes', r._rid, 'Nome Lead', r['Nome Lead'])}</span></div>
        <div class="f"><span class="k">Telefone</span><span class="v">${inlineField('indicacoes', r._rid, 'Telefone Lead', r['Telefone Lead'])}</span></div>
        <div class="f"><span class="k">Data da Indicação</span><span class="v">${inlineField('indicacoes', r._rid, 'Data Indicacao', r['Data Indicacao'], 'date')}</span></div>
        <div class="f"><span class="k">Status</span><span class="v">${inlineField('indicacoes', r._rid, 'Status_Lead', r['Status_Lead'])}</span></div>
        <div class="f"><span class="k">Nível Embaixador</span><span class="v">${inlineField('indicacoes', r._rid, 'Nível Embaixador', r['Nível Embaixador'])}</span></div>
        <div class="f"><span class="k">Recompensa</span><span class="v">${inlineField('indicacoes', r._rid, 'Recompensa', r['Recompensa'])}</span></div>
      </div>
    </div>
  `).join('');
  openModal(`
    <h3>Indicações — ${esc(p['Nome Completo'])} <span class="small">(${esc(p['ID Paciente'])})</span></h3>
    <div class="small" style="margin-bottom:10px;">Todos os leads já indicados por este paciente/embaixador. Os campos abaixo são editáveis direto aqui.</div>
    <button class="btn" style="margin-bottom:14px;" onclick="openNewIndicacaoForm('${esc(patientId)}')">+ Nova Indicação para este embaixador</button>
    ${entradas.length ? itemHtml : '<div class="small">Nenhuma indicação registrada ainda — clique em "+ Nova Indicação para este embaixador" acima para começar.</div>'}
  `, patientId);
}
