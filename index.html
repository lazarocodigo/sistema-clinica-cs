function openNewIndicacaoForm(preselectEmbaixadorId){
  const dlOptions = DB.pacientes.map(p=>`<option value="${esc(p['ID Paciente'])} — ${esc(p['Nome Completo'])}"></option>`).join('');
  const pre = preselectEmbaixadorId ? DB.pacientes.find(p=>p['ID Paciente']===preselectEmbaixadorId) : null;
  const preLabel = pre ? `${pre['ID Paciente']} — ${pre['Nome Completo']}` : '';
  openModal(`
    <h3>Nova Indicação</h3>
    <div class="form-grid" id="new-ind-form">
      <label class="full">Paciente Embaixador
        <input type="text" name="Embaixador Busca" list="dl-ind-embaixador" autocomplete="off" placeholder="Digite o nome ou ID do embaixador..." value="${esc(preLabel)}">
        <datalist id="dl-ind-embaixador">${dlOptions}</datalist>
      </label>
      <label>Nome do Lead <input type="text" name="Nome Lead"></label>
      <label>Telefone do Lead <input type="text" name="Telefone Lead"></label>
      <label>Data da Indicação <input type="date" name="Data Indicacao"></label>
      <label>Status do Lead <input type="text" name="Status_Lead" placeholder="Ex: Em contato"></label>
      <label>Nível do Embaixador <input type="text" name="Nível Embaixador"></label>
      <label>Recompensa <input type="text" name="Recompensa"></label>
      <label class="full"><button class="btn" onclick="saveNewIndicacao()">Salvar Indicação</button></label>
    </div>
  `);
}
// Ao salvar, sempre cria um novo registro de histórico de leads (nunca duplica a linha do embaixador em si)
// e reabre o histórico do embaixador para mostrar a indicação recém-lançada no contexto completo.
function saveNewIndicacao(){
  const form = document.getElementById('new-ind-form');
  const rec = {};
  form.querySelectorAll('[name]').forEach(el=>{ if(el.name!=='Embaixador Busca') rec[el.name]=el.value||null; });
  const busca = (form.querySelector('[name="Embaixador Busca"]')||{}).value || '';
  const m = /^(\S+)\s+—/.exec(busca.trim());
  const p = m ? DB.pacientes.find(p=>p['ID Paciente']===m[1]) : null;
  if(!p){
    alert('Selecione um embaixador válido: digite o nome ou ID e escolha uma das sugestões da lista.');
    return;
  }
  rec['ID Embaixador'] = p['ID Paciente'];
  rec['Nome Embaixador'] = p['Nome Completo'];
  rec._rid = newRowRid(rec['ID Embaixador']);
  DB.indicacoes.push(rec);
  persist();
  renderNav(CURRENT);
  if(RENDERERS[CURRENT]) RENDERERS[CURRENT]();
  openIndicacaoHistorico(p['ID Paciente']);
}

// ================= AVALIAÇÕES (alimentam o Health Score) =================
const AVAL_SETORES = ['Enfermagem','Nutrição','Recepção','Médico','CS'];
let avalSetorAtivo = 'Enfermagem';
function renderAvaliacoes(){
  const sheetKey = AVAL_SHEET_MAP[avalSetorAtivo];
  const entries = DB[sheetKey] || [];
  document.getElementById('content').innerHTML = `
    <div class="tabs-sub">${AVAL_SETORES.map(s=>`<button class="${s===avalSetorAtivo?'active':''}" data-s="${s}">${s} (${(DB[AVAL_SHEET_MAP[s]]||[]).length})</button>`).join('')}</div>
    <div class="note hs">❤️ Cada nota lançada aqui recalcula o Health Score do paciente automaticamente — sem precisar de nenhuma outra ação.</div>
    <div class="toolbar">
      <button class="btn hs" onclick="openNewAvalForm()">+ Nova Avaliação de ${avalSetorAtivo}</button>
    </div>
    <div id="tbl-aval"></div>
  `;
  document.querySelectorAll('.tabs-sub button').forEach(b=> b.onclick = ()=>{ avalSetorAtivo=b.dataset.s; renderAvaliacoes(); });
  const cols = [
    {key:'ID Paciente', label:'ID'},
    {key:'_prontuario', label:'Prontuário'},
    {key:'Nome Paciente', label:'Paciente'},
    {key:'Data Avaliação', label:'Data', render:r=>fmtDate(r['Data Avaliação'])},
    {key:'Semana', label:'Semana'},
    {key:'Nota (0-10)', label:'Nota'},
    {key:'Observação', label:'Observação'},
  ];
  renderTable({containerId:'tbl-aval', columns:cols, rows:entries.map(r=>({...r, _prontuario: prontuarioOf(r['ID Paciente'])})), searchKeys:['Nome Paciente','ID Paciente','_prontuario'],
    emptyMsg:`Sem avaliações de ${avalSetorAtivo} registradas ainda.`});
}
// preselectPatientId: quando aberto a partir do Health Score de um paciente específico, o paciente já
// vem selecionado no formulário — evita que a avaliação seja lançada sem querer para outro paciente.
function openNewAvalForm(preselectPatientId){
  const opts = DB.pacientes.map(p=>`<option value="${p['ID Paciente']}" ${p['ID Paciente']===preselectPatientId?'selected':''}>${esc(p['ID Paciente'])} — ${esc(p['Nome Completo'])}</option>`).join('');
  const pre = preselectPatientId ? DB.pacientes.find(p=>p['ID Paciente']===preselectPatientId) : null;
  openModal(`
    <h3>Nova Avaliação — ${avalSetorAtivo}${pre?` · ${esc(pre['Nome Completo'])}`:''}</h3>
    <div class="form-grid" id="new-aval-form">
      <label class="full">Paciente <select name="ID Paciente">${opts}</select></label>
      <label>Data Avaliação <input type="date" name="Data Avaliação"></label>
      <label>Semana <input type="text" name="Semana" placeholder="Semana 1"></label>
      <label>Nota (0–10) <input type="number" name="Nota (0-10)" min="0" max="10" step="0.5"></label>
      <label class="full">Observação <textarea name="Observação" rows="2"></textarea></label>
      <label class="full"><button class="btn hs" onclick="saveNewAval()">Salvar Avaliação</button></label>
    </div>
  `);
}
function saveNewAval(){
  const form = document.getElementById('new-aval-form');
  const rec = {};
  form.querySelectorAll('[name]').forEach(el=> rec[el.name] = el.type==='number' ? (el.value?parseFloat(el.value):null) : el.value || null);
  const p = DB.pacientes.find(p=>p['ID Paciente']===rec['ID Paciente']);
  rec['Nome Paciente'] = p ? p['Nome Completo'] : null;
  const sheetKey = AVAL_SHEET_MAP[avalSetorAtivo];
  DB[sheetKey].push(rec);
  persist(); closeModal(); renderNav(CURRENT); renderAvaliacoes();
}

// ================= CONFIGURAÇÕES (listas mestres) =================
let cfgTabAtiva = 'status';
function usageCount(configKey, value){
  const meta = CONFIG_META[configKey];
  return meta.usedBy.reduce((sum,u)=> sum + (DB[u.arrayKey]||[]).filter(r=>r[u.fieldKey]===value).length, 0);
}
function renderConfiguracoes(){
  const meta = CONFIG_META[cfgTabAtiva];
  const items = DB.config[cfgTabAtiva] || [];
  const usedByTxt = meta.usedBy.map(u=>`${PAGES[u.arrayKey]?PAGES[u.arrayKey].title:u.arrayKey} · ${u.fieldKey.trim()}`).join('  /  ');
  document.getElementById('content').innerHTML = `
    <div class="note">Renomear um item atualiza automaticamente todos os registros que usam esse valor (em todos os módulos que compartilham a lista). Remover um item usado pede confirmação.</div>
    <div class="tabs-sub">${Object.entries(CONFIG_META).map(([k,m])=>`<button class="${k===cfgTabAtiva?'active':''}" data-c="${k}">${m.label} (${(DB.config[k]||[]).length})</button>`).join('')}</div>
    <div class="card">
      <h3>${meta.label}</h3>
      <div class="small" style="margin-bottom:12px;">Usado em: ${esc(usedByTxt)}</div>
      <div id="cfg-list">
        ${items.length ? items.map((v,i)=>`
          <div class="cfg-row">
            <input type="text" class="cfg-input" value="${esc(v)}" onchange="renameConfigItem('${cfgTabAtiva}', ${i}, this.value)">
            <span class="small usage">${usageCount(cfgTabAtiva, v)} registro(s)</span>
            <button class="btn ghost" onclick="removeConfigItem('${cfgTabAtiva}', ${i})">🗑 Remover</button>
          </div>`).join('') : `<div class="empty-state"><div class="emoji">⚙️</div>Nenhuma opção cadastrada ainda para ${meta.label}.</div>`}
      </div>
      <div class="toolbar" style="margin-top:14px;">
        <input type="text" id="new-cfg-value" class="search" placeholder="Novo valor para ${meta.label}...">
        <button class="btn" onclick="addConfigItem('${cfgTabAtiva}')">+ Adicionar</button>
      </div>
    </div>
  `;
  document.querySelectorAll('.tabs-sub button[data-c]').forEach(b=> b.onclick = ()=>{ cfgTabAtiva=b.dataset.c; renderConfiguracoes(); });
}
function renameConfigItem(configKey, idx, newValRaw){
  const newVal = String(newValRaw).trim();
  const meta = CONFIG_META[configKey];
  const oldVal = DB.config[configKey][idx];
  if(!newVal || newVal===oldVal) { renderConfiguracoes(); return; }
  DB.config[configKey][idx] = newVal;
  meta.usedBy.forEach(u=>{
    (DB[u.arrayKey]||[]).forEach(r=>{ if(r[u.fieldKey]===oldVal) r[u.fieldKey] = newVal; });
  });
  persist();
  renderNav(CURRENT);
  renderConfiguracoes();
}
function removeConfigItem(configKey, idx){
  const meta = CONFIG_META[configKey];
  const val = DB.config[configKey][idx];
  const count = usageCount(configKey, val);
  if(count>0){
    const ok = confirm(`${count} registro(s) usam "${val}" em ${meta.label}. Remover mesmo assim? Esses registros ficarão com o campo em branco.`);
    if(!ok) return;
    meta.usedBy.forEach(u=>{
      (DB[u.arrayKey]||[]).forEach(r=>{ if(r[u.fieldKey]===val) r[u.fieldKey]=null; });
    });
  }
  DB.config[configKey].splice(idx,1);
  persist();
  renderNav(CURRENT);
  renderConfiguracoes();
}
function addConfigItem(configKey){
  const input = document.getElementById('new-cfg-value');
  const val = input.value.trim();
  if(!val) return;
  if(DB.config[configKey].some(v=>v.toLowerCase()===val.toLowerCase())){
    alert('Esse valor já existe na lista.');
    return;
  }
  DB.config[configKey].push(val);
  persist();
  renderConfiguracoes();
}

const RENDERERS = {
  healthscore: renderHealthScore, dashboard: renderDashboard, pacientes: renderPacientes, agendamentos: renderAgendamentos,
  interacoes: renderInteracoes, protocolos: renderProtocolos, adesao: renderAdesao,
  nps: renderNps, crosssell: renderCrosssell,
  indicacoes: renderIndicacoes, avaliacoes: renderAvaliacoes, configuracoes: renderConfiguracoes,
};
